name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node tests, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build workspaces
        run: npm run build

  windows-powershell:
    name: Windows PowerShell and setup archive checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Require Windows PowerShell 5.1
        shell: pwsh
        run: |
          $shell = Get-Command powershell.exe -ErrorAction Stop
          Write-Output ("Using " + $shell.Source)
      - name: Install locked dependencies
        run: npm ci
      - name: Run non-skippable Windows installer and archive checks
        env:
          FOUNDRY_MCP_PWSH_PATH: powershell.exe
          FOUNDRY_MCP_REQUIRE_POWERSHELL: "1"
        run: npx vitest run tests/windows-powershell.test.mjs tests/windows-package.test.mjs
