name: Public Foundry release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: public-foundry-release-assets
  cancel-in-progress: false

jobs:
  build:
    name: Validate source and prepare release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || 'Tommo999/foundry-vtt-mcp-releases' }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_ASSET_DIR: dist/releases/${{ github.ref_name }}
    steps:
      - name: Check out source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build and prepare versioned release assets
        run: npm run release:prepare -- --repository "$RELEASE_REPOSITORY"
      - name: Verify tag, checksums and ZIP contents
        run: node scripts/release-publication.mjs verify-local
      - name: Upload only the four public distribution assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            dist/releases/${{ github.ref_name }}/module.json
            dist/releases/${{ github.ref_name }}/foundry-vtt-mcp.zip
            dist/releases/${{ github.ref_name }}/foundry-vtt-windows-setup.zip
            dist/releases/${{ github.ref_name }}/SHA256SUMS.txt

  windows-powershell:
    name: Require Windows PowerShell smoke tests
    runs-on: windows-latest
    steps:
      - name: Check out source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Require Windows PowerShell 5.1
        shell: pwsh
        run: |
          $shell = Get-Command powershell.exe -ErrorAction Stop
          Write-Output ("Using " + $shell.Source)
      - name: Install locked dependencies
        run: npm ci
      - name: Run non-skippable Windows installer and archive checks
        env:
          FOUNDRY_MCP_PWSH_PATH: powershell.exe
          FOUNDRY_MCP_REQUIRE_POWERSHELL: "1"
        run: npx vitest run tests/windows-powershell.test.mjs tests/windows-package.test.mjs tests/release-publication.test.mjs

  publish:
    name: Publish verified assets to the public repository
    needs:
      - build
      - windows-powershell
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || 'Tommo999/foundry-vtt-mcp-releases' }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_ASSET_DIR: release-assets
    steps:
      - name: Check out source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Download the exact four-file build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Preflight public destination and release order
        id: preflight
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: node scripts/release-publication.mjs preflight
      - name: Create destination tag on its public default branch
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_DEFAULT_BRANCH: ${{ steps.preflight.outputs.default_branch }}
        run: node scripts/release-publication.mjs create-public-tag
      - name: Create an unpublished draft
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
          RELEASE_REPOSITORY: ${{ steps.preflight.outputs.repository }}
          RELEASE_NOTES_PATH: ${{ steps.preflight.outputs.notes_path }}
          RELEASE_PRERELEASE: ${{ steps.preflight.outputs.prerelease }}
        shell: bash
        run: |
          args=(release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH")
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
      - name: Upload assets without replacing existing files
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
          RELEASE_REPOSITORY: ${{ steps.preflight.outputs.repository }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RELEASE_ASSET_DIR/module.json" \
            "$RELEASE_ASSET_DIR/foundry-vtt-mcp.zip" \
            "$RELEASE_ASSET_DIR/foundry-vtt-windows-setup.zip" \
            "$RELEASE_ASSET_DIR/SHA256SUMS.txt" \
            --repo "$RELEASE_REPOSITORY"
      - name: Verify draft assets and uploaded hashes before publication
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
          RELEASE_REPOSITORY: ${{ steps.preflight.outputs.repository }}
        run: node scripts/release-publication.mjs verify-draft
      - name: Publish draft with stable or prerelease latest behavior
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
          RELEASE_REPOSITORY: ${{ steps.preflight.outputs.repository }}
          RELEASE_PRERELEASE: ${{ steps.preflight.outputs.prerelease }}
        shell: bash
        run: |
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest
          fi
      - name: Verify published assets are anonymously downloadable
        env:
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
          RELEASE_REPOSITORY: ${{ steps.preflight.outputs.repository }}
        run: node scripts/release-publication.mjs verify-published
